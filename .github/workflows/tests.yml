name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Vérification de la syntaxe
        run: for f in server.js verifier.js public/*.js tools/*.js; do node --check "$f" || exit 1; done
      - name: Traductions à jour
        run: node tools/i18n-build.js && git diff --exit-code public/lang
      - name: Tests du serveur
        run: node --test test/*.test.js
