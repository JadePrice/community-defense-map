<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:400;src:url(../../public/vendor/fonts/inter-400.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(../../public/vendor/fonts/inter-700.woff2)}
@font-face{font-family:Inter;font-weight:900;src:url(../../public/vendor/fonts/inter-900.woff2)}
html,body{margin:0}
.og{width:1200px;height:630px;box-sizing:border-box;padding:64px 72px;background:#121214;color:#f2f1f4;font-family:Inter,sans-serif;
  display:grid;grid-template-columns:1fr 300px;align-items:center;gap:40px;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(#24242a 1px,transparent 1px),linear-gradient(90deg,#24242a 1px,transparent 1px);background-size:60px 60px;opacity:.55}
.txt,.mark{position:relative}
h1{font-weight:900;font-size:84px;line-height:.98;margin:0 0 22px;letter-spacing:-1.5px}
.sub{font-weight:700;font-size:34px;color:#7fe0ef;margin:0 0 18px}
.line{font-size:27px;color:#c9c7d1;margin:0}
.foot{position:absolute;left:72px;bottom:40px;font-size:21px;color:#9a98a6}
.mark img{width:300px}
</style>
<div class="og"><div class="grid"></div>
  <div class="txt">
    <h1>Community<br>Defense Map</h1>
    <p class="sub">Police activity &amp; surveillance, mapped by the community</p>
    <p class="line">No account. No tracking. United States.</p>
  </div>
  <div class="mark"><img src="mark.svg" alt=""></div>
  <div class="foot">Free software (AGPL-3.0) · based on Cortège</div>
</div>
